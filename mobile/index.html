  <!--
    O ?v= no fim de cada arquivo NAO e enfeite.

    Sem ele, o navegador guarda js/app.js pelo endereco e continua
    servindo a copia velha mesmo depois de o servidor ter a nova - e o
    aplicativo abre com telas antigas sobre dados novos, sem erro
    nenhum. Ja aconteceu aqui.

    Mudando o endereco, a copia guardada deixa de valer e o arquivo e
    buscado de novo. Este numero tem de ser o MESMO do VERSAO_APP em
    js/app.js; o teste test/teste-telas-celular.js reprova se diferirem.
  -->
